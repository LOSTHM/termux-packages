name: Build llama.cpp with NDK + Vulkan
on:
  workflow_dispatch:
  push:
    branches: [ "ndk-build" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master

      - id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build libvulkan-dev

      - name: Configure
        run: |
          export NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          mkdir build-ndk && cd build-ndk
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_ARM_NEON=ON \
            -DGGML_CUDA=OFF -DGGML_METAL=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DVulkan_INCLUDE_DIRS=/usr/include

      - name: Build
        run: cd build-ndk && ninja llama-embedding -j$(nproc)

      - name: Package
        run: |
          mkdir -p artifact
          cp build-ndk/bin/llama-embedding artifact/
          cp build-ndk/bin/libggml*.so* artifact/ 2>/dev/null || true
          cp build-ndk/bin/libllama*.so* artifact/ 2>/dev/null || true
          cp ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so artifact/ 2>/dev/null || true
          ls -lh artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: llama-ndk-vulkan-arm64
          path: artifact/
